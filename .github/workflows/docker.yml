name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
      - name: Validate docker-compose.prod.yml
        run: |
          POSTGRES_USER=portfolio POSTGRES_PASSWORD=portfolio POSTGRES_DB=portfolio \
          DATABASE_URL=postgresql+asyncpg://portfolio:portfolio@db:5432/portfolio \
          docker compose -f docker-compose.prod.yml config -q

  build-images:
    runs-on: ubuntu-latest
    needs: compose-config
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            target: production
          - service: frontend
            context: ./frontend
            target: production
          - service: nginx
            context: ./nginx
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
