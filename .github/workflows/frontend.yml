name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit + accessibility tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Start database and backend
        run: docker compose up --build -d db backend
        working-directory: .
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready && exit 0
            sleep 2
          done
          echo "Backend never became ready" && exit 1

      - name: Apply migrations and seed data
        run: |
          docker compose exec -T backend uv run alembic upgrade head
          docker compose exec -T backend uv run python -m app.seed.seed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against the dev server
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          VITE_API_PROXY_TARGET: http://localhost:8000

      - name: Tear down docker services
        if: always()
        run: docker compose down -v
