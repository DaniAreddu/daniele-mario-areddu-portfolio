# Public reverse proxy: fronts the frontend (static SPA) and backend (API)
# services. This is the only container that should ever be exposed publicly.

limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=5r/m;
# A single page load fires several concurrent API calls (Home alone requests
# profile, biography, journey, projects, talks and community at once), so
# this needs real headroom for legitimate browsing, not just one request per
# second — it's a guard against abuse, not a per-page-view budget.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;
# Brute-force throttling for admin credential/2FA verification, on top of
# the app-level DB-backed rate limiting in AdminAuthService.
limit_req_zone $binary_remote_addr zone=admin_login_limit:10m rate=10r/m;

# Only upgrade the connection for genuine WebSocket requests (Vite's HMR
# client in development); everything else is a normal HTTP/1.1 proxy_pass.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Trusted-proxy handling: this server is the edge, so $remote_addr is the
    # real client IP as seen by Docker's network. If this gateway ever sits
    # behind another load balancer/CDN, add `set_real_ip_from` for that
    # upstream's CIDR and switch to X-Forwarded-For here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Parametrized so development (which needs Vite's inline HMR preamble
    # script and a websocket connection) and production (which doesn't) can
    # use different policies — see CONTENT_SECURITY_POLICY in
    # docker-compose.yml vs. docker-compose.prod.yml / this file's Dockerfile
    # default.
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Stricter rate limit specifically for the contact endpoint, in addition
    # to the application-level rate limiting in the API itself.
    location = /api/v1/contact {
        limit_req zone=contact_limit burst=3 nodelay;
        proxy_pass http://${BACKEND_UPSTREAM};
        include /etc/nginx/proxy-common.conf;
    }

    # Stricter rate limit for credential/2FA verification endpoints, to slow
    # down brute-force attempts beyond what the app-level throttling alone
    # provides. A regex location takes priority over the plain-prefix
    # `location /api/` below regardless of file order.
    location ~ ^/api/v1/admin/auth/(login|totp/verify)$ {
        limit_req zone=admin_login_limit burst=5 nodelay;
        proxy_pass http://${BACKEND_UPSTREAM};
        include /etc/nginx/proxy-common.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        # Matches Settings.media_max_upload_bytes (10 MB) plus headroom for
        # multipart overhead, so legitimate media uploads aren't rejected by
        # nginx's default 1 MB body cap before they ever reach the app.
        client_max_body_size 12m;
        proxy_pass http://${BACKEND_UPSTREAM};
        include /etc/nginx/proxy-common.conf;
    }

    location / {
        proxy_pass http://${FRONTEND_UPSTREAM};
        include /etc/nginx/proxy-common.conf;
        # WebSocket upgrade support for Vite's HMR client in development;
        # a no-op for the static production frontend.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
