name: areddu-portfolio

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only reachable from other containers on this network.

  backend:
    build:
      context: ./backend
      target: production
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ENVIRONMENT: production
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:mode=1777

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777

  gateway:
    build:
      context: ./nginx
    restart: always
    environment:
      FRONTEND_UPSTREAM: frontend:8080
      BACKEND_UPSTREAM: backend:8000
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      # The nginx image's entrypoint renders gateway.conf's ${FRONTEND_UPSTREAM}
      # / ${BACKEND_UPSTREAM} placeholders into this directory at container
      # start (see nginx/Dockerfile); it must stay writable even though the
      # rest of the image is read-only.
      - /etc/nginx/conf.d:mode=1777

volumes:
  db-data:
