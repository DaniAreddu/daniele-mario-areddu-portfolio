# Serves the built React SPA. Not exposed publicly on its own — the gateway
# service (see /nginx at the repo root) is the single public entry point and
# proxies to this container internally.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed build assets are immutable; cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Never cache HTML, so deploys are picked up immediately. `scripts/prerender.mjs`
    # writes a real, content-filled index.html per public route (e.g.
    # dist/about/index.html); $uri/ resolves "/about" to that file for
    # crawlers, while the client-side app still hydrates and takes over
    # normal SPA navigation for real visitors. Unrecognized paths fall back
    # to the root SPA shell, which renders the client-side 404 page.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
